name: Flutter Build

on:
  workflow_dispatch:
  pull_request:

jobs:
  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics
      - name: Flutter pub get
        run: flutter pub get
      - name: Create Temporary Signing Key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ui-templates-ci.jks" -storepass local-build-only -keypass local-build-only -alias source-build -dname "CN=CI, OU=Source Build, O=UI Templates, L=Local, S=Local, C=US" -keyalg RSA -keysize 2048 -validity 1
          echo "CM_KEYSTORE_PATH=$RUNNER_TEMP/ui-templates-ci.jks" >> "$GITHUB_ENV"
          echo "CM_KEYSTORE_PASSWORD=local-build-only" >> "$GITHUB_ENV"
          echo "CM_KEY_ALIAS=source-build" >> "$GITHUB_ENV"
          echo "CM_KEY_PASSWORD=local-build-only" >> "$GITHUB_ENV"
      - name: Flutter build appbundle
        run: flutter build appbundle --release

  build_ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter build iOS
        run: flutter build ios --release --no-codesign
