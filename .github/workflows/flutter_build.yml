name: Flutter Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics
      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile
      - name: Create Temporary Signing Key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ui-templates-ci.jks" -storepass local-build-only -keypass local-build-only -alias source-build -dname "CN=CI, OU=Source Build, O=UI Templates, L=Local, S=Local, C=US" -keyalg RSA -keysize 2048 -validity 1
          echo "CM_KEYSTORE_PATH=$RUNNER_TEMP/ui-templates-ci.jks" >> "$GITHUB_ENV"
          echo "CM_KEYSTORE_PASSWORD=local-build-only" >> "$GITHUB_ENV"
          echo "CM_KEY_ALIAS=source-build" >> "$GITHUB_ENV"
          echo "CM_KEY_PASSWORD=local-build-only" >> "$GITHUB_ENV"
      - name: Flutter build appbundle
        run: flutter build appbundle --release

  build_ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics
      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile
      - name: Flutter build iOS
        run: flutter build ios --release --no-codesign

  build_web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics
      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile
      - name: Flutter build Web
        run: flutter build web --release

  build_linux:
    name: Build Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics
      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile
      - name: Flutter build Linux
        run: flutter build linux --release

  build_macos:
    name: Build macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics
      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile
      - name: Flutter build macOS
        run: flutter build macos --release

  build_windows:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Disable analytics
        run: flutter config --no-analytics
      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile
      - name: Flutter build Windows
        run: flutter build windows --release
