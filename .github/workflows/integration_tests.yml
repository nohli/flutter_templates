name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 30, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          profile: medium_phone
          arch: x86_64
          script: flutter test integration_test

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Simulator
        id: simulator
        uses: futureware-tech/simulator-action@v5
        with:
          os_version: '26.2'
          model: 'iPhone 17'
      - name: Test
        run: flutter test integration_test -d "${{ steps.simulator.outputs.udid }}"

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test
        run: |
          chromedriver --port=4444 &
          flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_smoke_test.dart -d web-server

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev xvfb
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test
        run: xvfb-run -a flutter test integration_test -d linux

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test
        run: flutter test integration_test -d macos

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Test
        run: flutter test integration_test -d windows
