plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseSigning = [
    keyAlias: System.getenv('CM_KEY_ALIAS') ?: keystoreProperties['keyAlias'],
    keyPassword: System.getenv('CM_KEY_PASSWORD') ?: keystoreProperties['keyPassword'],
    storeFile: System.getenv('CM_KEYSTORE_PATH') ?: keystoreProperties['storeFile'],
    storePassword: System.getenv('CM_KEYSTORE_PASSWORD') ?: keystoreProperties['storePassword'],
]
def releaseSigningConfigured = releaseSigning.values().every { value ->
    value != null && !value.toString().trim().isEmpty()
}
if (releaseSigningConfigured) {
    releaseSigningConfigured = file(releaseSigning.storeFile).isFile()
}
def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('release')
}
if (releaseTaskRequested && !releaseSigningConfigured) {
    throw new GradleException(
        'Release signing requires Codemagic signing variables or complete android/key.properties values.'
    )
}

android {
    namespace = "com.achimsapps.templates"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
            }
        }
    }

    defaultConfig {
        ndk {
            debugSymbolLevel 'FULL'
        }

        applicationId = "com.achimsapps.templates"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
