workflows:
  ios:
    name: ios
    labels:
      - ios
    integrations:
      app_store_connect: $APP_STORE_CONNECT_INTEGRATION
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      cancel_previous_builds: true
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      groups:
        - release_config
      ios_signing: &ios_signing
        distribution_type: app_store
        bundle_identifier: com.achimsapps.templates
      vars:
        CM_CLONE_UNSHALLOW: 'true'
      flutter: stable
      xcode: '27.0'
    scripts:
      - &check_app_settings
        name: Check Release Contact Settings
        script: |
          set -eu
          : "${SUPPORT_EMAIL:?Add SUPPORT_EMAIL to the release_config group}"
          : "${PRIVACY_POLICY_URL:?Add PRIVACY_POLICY_URL to the release_config group}"
          : "${SUPPORT_URL:?Add SUPPORT_URL to the release_config group}"
      - &get_packages
        name: Get Packages
        script: |
          set -eu
          flutter pub get
      - &apply_signing
        name: Apply Signing Profiles
        script: xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Build IPA
        script: |
          set -eu
          shallow_repository="$(git rev-parse --is-shallow-repository)"
          [ "$shallow_repository" = false ] || { echo "Codemagic checkout must contain the full Git history" >&2; exit 1; }
          build_number="$(git rev-list --count HEAD)"
          flutter build ipa --release \
            --build-number="$build_number" \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define="SUPPORT_EMAIL=$SUPPORT_EMAIL" \
            --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL" \
            --dart-define="SUPPORT_URL=$SUPPORT_URL"
      - name: Verify IPA
        script: |
          set -eu
          : "${CM_BUILD_DIR:?Codemagic must provide the repository clone directory}"
          set -- "$CM_BUILD_DIR/build/ios/ipa/"*.ipa
          for artifact in "$@"; do
            [ -f "$artifact" ] && [ -s "$artifact" ] || { echo "Missing or empty IPA artifact: $artifact" >&2; exit 1; }
          done
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive/dSYMs/**/*.dSYM
    publishing:
      scripts:
        - name: Verify Collected IPA
          script: |
            set -eu
            ruby -rjson -e 'artifacts = JSON.parse(ENV.fetch("CM_ARTIFACT_LINKS", "[]")); abort "Codemagic collected no .ipa artifact; publishing cannot succeed" unless artifacts.any? { |artifact| File.extname(artifact.fetch("name", "")) == ".ipa" }'
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - $TESTFLIGHT_BETA_GROUP
      slack: &failure_notifications
        channel: $SLACK_CHANNEL
        notify_on_build_start: false
        notify:
          success: false
          failure: true

  android:
    name: android
    labels:
      - android
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      cancel_previous_builds: true
    environment:
      xcode: '27.0'
      groups:
        - google_play_credentials
        - release_config
      android_signing:
        - $ANDROID_KEYSTORE_REFERENCE
      vars:
        CM_CLONE_UNSHALLOW: 'true'
      flutter: stable
    scripts:
      - *check_app_settings
      - name: Get Packages
        script: |
          set -eu
          flutter pub get
      - name: Build App Bundle
        script: |
          set -eu
          shallow_repository="$(git rev-parse --is-shallow-repository)"
          [ "$shallow_repository" = false ] || { echo "Codemagic checkout must contain the full Git history" >&2; exit 1; }
          build_number="$(git rev-list --count HEAD)"
          flutter build appbundle --release --build-number="$build_number" \
            --dart-define="SUPPORT_EMAIL=$SUPPORT_EMAIL" \
            --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL" \
            --dart-define="SUPPORT_URL=$SUPPORT_URL"
      - name: Verify App Bundle
        script: |
          set -eu
          : "${CM_BUILD_DIR:?Codemagic must provide the repository clone directory}"
          set -- "$CM_BUILD_DIR/build/app/outputs/bundle/release/"*.aab
          for artifact in "$@"; do
            [ -f "$artifact" ] && [ -s "$artifact" ] || { echo "Missing or empty App Bundle artifact: $artifact" >&2; exit 1; }
          done
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      scripts:
        - name: Verify Collected App Bundle
          script: |
            set -eu
            ruby -rjson -e 'artifacts = JSON.parse(ENV.fetch("CM_ARTIFACT_LINKS", "[]")); abort "Codemagic collected no .aab artifact; publishing cannot succeed" unless artifacts.any? { |artifact| File.extname(artifact.fetch("name", "")) == ".aab" }'
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
      slack:
        channel: $SLACK_CHANNEL
        notify_on_build_start: false
        notify:
          success: false
          failure: true

  web:
    name: web
    instance_type: mac_mini_m2
    max_build_duration: 30
    triggering:
      cancel_previous_builds: true
    environment:
      xcode: '27.0'
      groups:
        - cloudflare_credentials
        - release_config
      flutter: stable
    scripts:
      - *check_app_settings
      - name: Get Packages
        script: |
          set -eu
          flutter pub get
      - name: Build Web
        script: |
          flutter build web --release \
            --dart-define="SUPPORT_EMAIL=$SUPPORT_EMAIL" \
            --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL" \
            --dart-define="SUPPORT_URL=$SUPPORT_URL"
      - name: Publish Web
        script: |
          set -eu
          : "${CLOUDFLARE_ACCOUNT_ID:?Add CLOUDFLARE_ACCOUNT_ID to the cloudflare_credentials group}"
          : "${CLOUDFLARE_API_TOKEN:?Add CLOUDFLARE_API_TOKEN to the cloudflare_credentials group}"
          : "${CLOUDFLARE_PAGES_PROJECT:?Add CLOUDFLARE_PAGES_PROJECT to the cloudflare_credentials group}"
          npx --yes wrangler@4.133.0 pages deploy build/web --project-name="$CLOUDFLARE_PAGES_PROJECT"
    artifacts:
      - build/web/**
    publishing:
      scripts:
        - name: Verify Collected Web
          script: |
            set -eu
            ruby -rjson -e 'artifacts = JSON.parse(ENV.fetch("CM_ARTIFACT_LINKS", "[]")); abort "Codemagic collected no web artifacts" if artifacts.empty?'
      slack:
        channel: $SLACK_CHANNEL
        notify_on_build_start: false
        notify:
          success: false
          failure: true

  ios_shorebird:
    name: ios shorebird
    labels:
      - ios shorebird
    integrations:
      app_store_connect: $APP_STORE_CONNECT_INTEGRATION
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      cancel_previous_builds: true
    environment:
      groups:
        - shorebird
        - release_config
      ios_signing: *ios_signing
      vars:
        CM_CLONE_UNSHALLOW: 'true'
      flutter: stable
      xcode: '27.0'
    scripts:
      - *check_app_settings
      - &prepare_shorebird
        name: Prepare Shorebird Configuration
        script: ruby tool/prepare_shorebird.rb
      - &install_shorebird
        name: Install Shorebird
        script: |
          set -eu
          : "${SHOREBIRD_TOKEN:?Add SHOREBIRD_TOKEN to the shorebird group for this application}"
          shorebird_root="$HOME/.shorebird"
          if [ ! -d "$shorebird_root" ]; then
            git clone -b stable https://github.com/shorebirdtech/shorebird.git "$shorebird_root"
          fi
          "$shorebird_root/bin/shorebird" --version
          echo "PATH=$shorebird_root/bin:$PATH" >> "$CM_ENV"
      - *get_packages
      - *apply_signing
      - name: Build IPA
        script: |
          set -eu
          shallow_repository="$(git rev-parse --is-shallow-repository)"
          [ "$shallow_repository" = false ] || { echo "Codemagic checkout must contain the full Git history" >&2; exit 1; }
          build_number="$(git rev-list --count HEAD)"
          shorebird release ios --flutter-version=latest \
            --build-number="$build_number" \
            --export-options-plist=/Users/builder/export_options.plist \
            -- \
            --dart-define="SUPPORT_EMAIL=$SUPPORT_EMAIL" \
            --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL" \
            --dart-define="SUPPORT_URL=$SUPPORT_URL"
      - name: Verify IPA
        script: |
          set -eu
          : "${CM_BUILD_DIR:?Codemagic must provide the repository clone directory}"
          set -- "$CM_BUILD_DIR/build/ios/ipa/"*.ipa
          for artifact in "$@"; do
            [ -f "$artifact" ] && [ -s "$artifact" ] || { echo "Missing or empty IPA artifact: $artifact" >&2; exit 1; }
          done
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive/dSYMs/**/*.dSYM
    publishing:
      scripts:
        - name: Verify Collected IPA
          script: |
            set -eu
            ruby -rjson -e 'artifacts = JSON.parse(ENV.fetch("CM_ARTIFACT_LINKS", "[]")); abort "Codemagic collected no .ipa artifact; publishing cannot succeed" unless artifacts.any? { |artifact| File.extname(artifact.fetch("name", "")) == ".ipa" }'
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - $TESTFLIGHT_BETA_GROUP
      slack: *failure_notifications

  android_shorebird:
    name: android shorebird
    labels:
      - android shorebird
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      cancel_previous_builds: true
    environment:
      xcode: '27.0'
      groups:
        - google_play_credentials
        - shorebird
        - release_config
      android_signing:
        - $ANDROID_KEYSTORE_REFERENCE
      vars:
        CM_CLONE_UNSHALLOW: 'true'
      flutter: stable
    scripts:
      - *check_app_settings
      - *prepare_shorebird
      - *install_shorebird
      - name: Get Packages
        script: |
          set -eu
          flutter pub get
      - name: Build App Bundle
        script: |
          set -eu
          shallow_repository="$(git rev-parse --is-shallow-repository)"
          [ "$shallow_repository" = false ] || { echo "Codemagic checkout must contain the full Git history" >&2; exit 1; }
          build_number="$(git rev-list --count HEAD)"
          shorebird release android --flutter-version=latest --build-number="$build_number" -- \
            --dart-define="SUPPORT_EMAIL=$SUPPORT_EMAIL" \
            --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL" \
            --dart-define="SUPPORT_URL=$SUPPORT_URL"
      - name: Verify App Bundle
        script: |
          set -eu
          : "${CM_BUILD_DIR:?Codemagic must provide the repository clone directory}"
          set -- "$CM_BUILD_DIR/build/app/outputs/bundle/release/"*.aab
          for artifact in "$@"; do
            [ -f "$artifact" ] && [ -s "$artifact" ] || { echo "Missing or empty App Bundle artifact: $artifact" >&2; exit 1; }
          done
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      scripts:
        - name: Verify Collected App Bundle
          script: |
            set -eu
            ruby -rjson -e 'artifacts = JSON.parse(ENV.fetch("CM_ARTIFACT_LINKS", "[]")); abort "Codemagic collected no .aab artifact; publishing cannot succeed" unless artifacts.any? { |artifact| File.extname(artifact.fetch("name", "")) == ".aab" }'
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
      slack:
        channel: $SLACK_CHANNEL
        notify_on_build_start: false
        notify:
          success: false
          failure: true

  ios_shorebird_patch:
    name: ios shorebird patch
    labels:
      - ios shorebird patch
    integrations:
      app_store_connect: $APP_STORE_CONNECT_INTEGRATION
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      cancel_previous_builds: true
    inputs: &patch_inputs
      release_version:
        description: Exact installed build to fix, such as 1.0.0+1.2.3
        type: string
        default: ''
      dry_run:
        description: Dry-run - validate without uploading a patch
        type: boolean
        default: false
    environment:
      groups:
        - shorebird
        - release_config
      ios_signing: *ios_signing
      flutter: stable
      xcode: '27.0'
    scripts:
      - &validate_patch
        name: Validate Patch Inputs
        script: |
          set -eu
          export SHOREBIRD_RELEASE_VERSION="${{ inputs.release_version }}"
          ruby -e 'abort "Enter an exact app version and build, such as 1.0.0+123" unless ENV.fetch("SHOREBIRD_RELEASE_VERSION", "").match?(/\A[0-9]+(?:\.[0-9]+){1,2}\+[0-9]+\z/)'
          case "${{ inputs.dry_run }}" in
            true|false) ;;
            *) echo "dry_run must be true or false" >&2; exit 1 ;;
          esac
          : "${CM_ENV:?Codemagic must provide its environment file}"
          printf 'SHOREBIRD_RELEASE_VERSION=%s\n' "$SHOREBIRD_RELEASE_VERSION" >> "$CM_ENV"
      - *check_app_settings
      - *prepare_shorebird
      - *install_shorebird
      - *get_packages
      - *apply_signing
      - name: Publish iOS Patch
        script: |
          set -eu
          set -- ios "--release-version=$SHOREBIRD_RELEASE_VERSION" --track=staging --export-options-plist=/Users/builder/export_options.plist
          if [ "${{ inputs.dry_run }}" = true ]; then
            set -- "$@" --dry-run
          fi
          shorebird patch "$@" -- \
            --dart-define="SUPPORT_EMAIL=$SUPPORT_EMAIL" \
            --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL" \
            --dart-define="SUPPORT_URL=$SUPPORT_URL"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive/dSYMs/**/*.dSYM
    publishing:
      slack: *failure_notifications

  android_shorebird_patch:
    name: android shorebird patch
    labels:
      - android shorebird patch
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      cancel_previous_builds: true
    inputs: *patch_inputs
    environment:
      xcode: '27.0'
      groups:
        - shorebird
        - release_config
      android_signing:
        - $ANDROID_KEYSTORE_REFERENCE
      flutter: stable
    scripts:
      - *validate_patch
      - *check_app_settings
      - *prepare_shorebird
      - *install_shorebird
      - *get_packages
      - name: Publish Android Patch
        script: |
          set -eu
          set -- android "--release-version=$SHOREBIRD_RELEASE_VERSION" --track=staging
          if [ "${{ inputs.dry_run }}" = true ]; then
            set -- "$@" --dry-run
          fi
          shorebird patch "$@" -- \
            --dart-define="SUPPORT_EMAIL=$SUPPORT_EMAIL" \
            --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL" \
            --dart-define="SUPPORT_URL=$SUPPORT_URL"
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      slack: *failure_notifications
