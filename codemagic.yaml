            ruby -rjson -e 'artifacts = JSON.parse(ENV.fetch("CM_ARTIFACT_LINKS", "[]")); abort "Codemagic collected no .aab artifact; publishing cannot succeed" unless artifacts.any? { |artifact| File.extname(artifact.fetch("name", "")) == ".aab" }'
      google_play:
