  ios_shorebird_patch:
    name: ios shorebird patch
    labels:
      - ios shorebird patch
    integrations:
      app_store_connect: $APP_STORE_CONNECT_INTEGRATION
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      cancel_previous_builds: true
    inputs: &patch_inputs
      release_version:
        description: Exact installed build to fix, such as 1.0.0+1.2.3
        type: string
        default: ''
      dry_run:
        description: Dry-run - validate without uploading a patch
        type: boolean
        default: false
    environment:
      groups:
        - shorebird
        - release_config
      ios_signing: *ios_signing
      flutter: stable
      xcode: '27.1'
    scripts:
      - &validate_patch
        name: Validate Patch Inputs
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            set -eu
            export SHOREBIRD_RELEASE_VERSION="${{ inputs.release_version }}"
            ruby -e 'abort "Enter an exact app version and build, such as 1.0.0+123" unless ENV.fetch("SHOREBIRD_RELEASE_VERSION", "").match?(/\A[0-9]+(?:\.[0-9]+){1,2}\+[0-9]+\z/)'
            case "${{ inputs.dry_run }}" in
              true|false) ;;
              *) echo "dry_run must be true or false" >&2; exit 1 ;;
            esac
            : "${CM_ENV:?Codemagic must provide its environment file}"
            printf 'SHOREBIRD_RELEASE_VERSION=%s\n' "$SHOREBIRD_RELEASE_VERSION" >> "$CM_ENV"
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/validate-patch-inputs.log"
      - *check_app_settings
      - *prepare_shorebird
      - *install_shorebird
      - *get_packages
      - *apply_signing
      - name: Publish iOS Patch
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            set -eu
            set -- ios "--release-version=$SHOREBIRD_RELEASE_VERSION" --track=staging --export-options-plist=/Users/builder/export_options.plist
            if [ "${{ inputs.dry_run }}" = true ]; then
              set -- "$@" --dry-run
            fi
            shorebird patch "$@" -- \
              --dart-define="SUPPORT_EMAIL=$SUPPORT_EMAIL" \
              --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL" \
              --dart-define="SUPPORT_URL=$SUPPORT_URL"
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/publish-ios-patch.log"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive/dSYMs/**/*.dSYM
      - $CM_BUILD_DIR/build/logs/*.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      slack: *failure_notifications

  android_shorebird_patch:
    name: android shorebird patch
    labels:
      - android shorebird patch
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      cancel_previous_builds: true
    inputs: *patch_inputs
    environment:
      xcode: '27.1'
      groups:
        - shorebird
        - release_config
      android_signing:
        - $ANDROID_KEYSTORE_REFERENCE
      flutter: stable
    scripts:
      - *validate_patch
      - *check_app_settings
      - *prepare_shorebird
      - *install_shorebird
      - *get_packages
      - name: Publish Android Patch
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            set -eu
            set -- android "--release-version=$SHOREBIRD_RELEASE_VERSION" --track=staging
            if [ "${{ inputs.dry_run }}" = true ]; then
              set -- "$@" --dry-run
            fi
            shorebird patch "$@" -- \
              --dart-define="SUPPORT_EMAIL=$SUPPORT_EMAIL" \
              --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL" \
              --dart-define="SUPPORT_URL=$SUPPORT_URL"
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/publish-android-patch.log"
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
      - $CM_BUILD_DIR/build/logs/*.log
    publishing:
      slack: *failure_notifications
