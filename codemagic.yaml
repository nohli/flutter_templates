workflows:
  ios:
    name: ios
    integrations:
      app_store_connect: Codemagic
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      cancel_previous_builds: true
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.achimsapps.templates
      vars:
        CM_CLONE_UNSHALLOW: 'true'
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Packages
        script: |
          set -eu
          flutter pub get
      - name: Apply Signing Profiles
        script: xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Build IPA
        script: |
          set -eu
          shallow_repository="$(git rev-parse --is-shallow-repository)"
          [ "$shallow_repository" = false ] || { echo "Codemagic checkout must contain the full Git history" >&2; exit 1; }
          build_number="$(git rev-list --count HEAD)"
          flutter build ipa --release --build-number="$build_number"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive/dSYMs/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Tester
      slack:
        channel: '#codemagic-builds'
        notify_on_build_start: false
        notify:
          success: false
          failure: true

  android:
    name: android
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      cancel_previous_builds: true
    environment:
      groups:
        - google_play_credentials
      android_signing:
        - Keystore
      vars:
        CM_CLONE_UNSHALLOW: 'true'
      flutter: stable
    scripts:
      - name: Get Packages
        script: |
          set -eu
          flutter pub get
      - name: Build App Bundle
        script: |
          set -eu
          shallow_repository="$(git rev-parse --is-shallow-repository)"
          [ "$shallow_repository" = false ] || { echo "Codemagic checkout must contain the full Git history" >&2; exit 1; }
          build_number="$(git rev-list --count HEAD)"
          flutter build appbundle --release --build-number="$build_number"
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
      slack:
        channel: '#codemagic-builds'
        notify_on_build_start: false
        notify:
          success: false
          failure: true

  web:
    name: web
    instance_type: mac_mini_m2
    max_build_duration: 30
    triggering:
      cancel_previous_builds: true
    environment:
      groups:
        - cloudflare_credentials
      flutter: stable
    scripts:
      - name: Get Packages
        script: |
          set -eu
          flutter pub get
      - name: Build Web
        script: flutter build web --release
      - name: Publish Web
        script: |
          set -eu
          : "${CLOUDFLARE_ACCOUNT_ID:?Add CLOUDFLARE_ACCOUNT_ID to the cloudflare_credentials group}"
          : "${CLOUDFLARE_API_TOKEN:?Add CLOUDFLARE_API_TOKEN to the cloudflare_credentials group}"
          npx --yes wrangler@4.133.0 pages deploy build/web --project-name=fluttertemplates
    artifacts:
      - build/web/**
    publishing:
      slack:
        channel: '#codemagic-builds'
        notify_on_build_start: false
        notify:
          success: false
          failure: true
