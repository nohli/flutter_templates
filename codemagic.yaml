workflows:
  ios:
    name: ios
    labels:
      - ios
    integrations:
      app_store_connect: $APP_STORE_CONNECT_INTEGRATION
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      cancel_previous_builds: true
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      groups:
        - release_config
      ios_signing: &ios_signing
        distribution_type: app_store
        bundle_identifier: com.achimsapps.templates
      vars:
        CM_CLONE_UNSHALLOW: 'true'
      flutter: stable
      xcode: '27.1'
    scripts:
      - &check_app_settings
        name: Check Release Contact Settings
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            set -eu
            : "${SUPPORT_EMAIL:?Add SUPPORT_EMAIL to the release_config group}"
            : "${PRIVACY_POLICY_URL:?Add PRIVACY_POLICY_URL to the release_config group}"
            : "${SUPPORT_URL:?Add SUPPORT_URL to the release_config group}"
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/check-release-contact-settings.log"
      - &get_packages
        name: Get Packages
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            set -eu
            flutter pub get
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/get-packages.log"
      - &apply_signing
        name: Apply Signing Profiles
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            xcode-project use-profiles --project ios/Runner.xcodeproj
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/apply-signing-profiles.log"
      - name: Build IPA
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            set -eu
            shallow_repository="$(git rev-parse --is-shallow-repository)"
            [ "$shallow_repository" = false ] || { echo "Codemagic checkout must contain the full Git history" >&2; exit 1; }
            build_number="$(git rev-list --count HEAD)"
            flutter build ipa --release \
              --build-number="$build_number" \
              --export-options-plist=/Users/builder/export_options.plist \
              --dart-define="SUPPORT_EMAIL=$SUPPORT_EMAIL" \
              --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL" \
              --dart-define="SUPPORT_URL=$SUPPORT_URL"
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/build-ipa.log"
      - name: Verify IPA
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            set -eu
            : "${CM_BUILD_DIR:?Codemagic must provide the repository clone directory}"
            set -- "$CM_BUILD_DIR/build/ios/ipa/"*.ipa
            for artifact in "$@"; do
              [ -f "$artifact" ] && [ -s "$artifact" ] || { echo "Missing or empty IPA artifact: $artifact" >&2; exit 1; }
            done
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/verify-ipa.log"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive/dSYMs/**/*.dSYM
      - $CM_BUILD_DIR/build/logs/*.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      scripts:
        - name: Verify Collected IPA
          script: |
            set -eu
            ruby -rjson -e 'artifacts = JSON.parse(ENV.fetch("CM_ARTIFACT_LINKS", "[]")); abort "Codemagic collected no .ipa artifact; publishing cannot succeed" unless artifacts.any? { |artifact| File.extname(artifact.fetch("name", "")) == ".ipa" }'
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - $TESTFLIGHT_BETA_GROUP
      slack: &failure_notifications
        channel: $SLACK_CHANNEL
        notify_on_build_start: false
        notify:
          success: false
          failure: true

  android:
    name: android
    labels:
      - android
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      cancel_previous_builds: true
    environment:
      xcode: '27.1'
      groups:
        - google_play_credentials
        - release_config
      android_signing:
        - $ANDROID_KEYSTORE_REFERENCE
      vars:
        CM_CLONE_UNSHALLOW: 'true'
      flutter: stable
    scripts:
      - *check_app_settings
      - name: Get Packages
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            set -eu
            flutter pub get
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/get-packages.log"
      - name: Build App Bundle
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            set -eu
            shallow_repository="$(git rev-parse --is-shallow-repository)"
            [ "$shallow_repository" = false ] || { echo "Codemagic checkout must contain the full Git history" >&2; exit 1; }
            build_number="$(git rev-list --count HEAD)"
            flutter build appbundle --release --build-number="$build_number" \
              --dart-define="SUPPORT_EMAIL=$SUPPORT_EMAIL" \
              --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL" \
              --dart-define="SUPPORT_URL=$SUPPORT_URL"
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/build-app-bundle.log"
      - name: Verify App Bundle
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            set -eu
            : "${CM_BUILD_DIR:?Codemagic must provide the repository clone directory}"
            set -- "$CM_BUILD_DIR/build/app/outputs/bundle/release/"*.aab
            for artifact in "$@"; do
              [ -f "$artifact" ] && [ -s "$artifact" ] || { echo "Missing or empty App Bundle artifact: $artifact" >&2; exit 1; }
            done
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/verify-app-bundle.log"
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
      - $CM_BUILD_DIR/build/logs/*.log
    publishing:
      scripts:
        - name: Verify Collected App Bundle
          script: |
            set -eu
            ruby -rjson -e 'artifacts = JSON.parse(ENV.fetch("CM_ARTIFACT_LINKS", "[]")); abort "Codemagic collected no .aab artifact; publishing cannot succeed" unless artifacts.any? { |artifact| File.extname(artifact.fetch("name", "")) == ".aab" }'
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
      slack:
        channel: $SLACK_CHANNEL
        notify_on_build_start: false
        notify:
          success: false
          failure: true

  web:
    name: web
    instance_type: mac_mini_m2
    max_build_duration: 30
    triggering:
      cancel_previous_builds: true
    environment:
      xcode: '27.1'
      groups:
        - cloudflare_credentials
        - release_config
      flutter: stable
    scripts:
      - *check_app_settings
      - name: Get Packages
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            set -eu
            flutter pub get
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/get-packages.log"
      - name: Build Web
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            flutter build web --release \
              --dart-define="SUPPORT_EMAIL=$SUPPORT_EMAIL" \
              --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL" \
              --dart-define="SUPPORT_URL=$SUPPORT_URL"
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/build-web.log"
      - name: Publish Web
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            set -eu
            : "${CLOUDFLARE_ACCOUNT_ID:?Add CLOUDFLARE_ACCOUNT_ID to the cloudflare_credentials group}"
            : "${CLOUDFLARE_API_TOKEN:?Add CLOUDFLARE_API_TOKEN to the cloudflare_credentials group}"
            : "${CLOUDFLARE_PAGES_PROJECT:?Add CLOUDFLARE_PAGES_PROJECT to the cloudflare_credentials group}"
            npx --yes wrangler@4.133.0 pages deploy build/web --project-name="$CLOUDFLARE_PAGES_PROJECT"
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/publish-web.log"
    artifacts:
      - build/web/**
      - $CM_BUILD_DIR/build/logs/*.log
    publishing:
      scripts:
        - name: Verify Collected Web
          script: |
            set -eu
            ruby -rjson -e 'artifacts = JSON.parse(ENV.fetch("CM_ARTIFACT_LINKS", "[]")); abort "Codemagic collected no web artifacts" if artifacts.empty?'
      slack:
        channel: $SLACK_CHANNEL
        notify_on_build_start: false
        notify:
          success: false
          failure: true

  ios_shorebird:
    name: ios shorebird
    labels:
      - ios shorebird
    integrations:
      app_store_connect: $APP_STORE_CONNECT_INTEGRATION
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      cancel_previous_builds: true
    environment:
      groups:
        - shorebird
        - release_config
      ios_signing: *ios_signing
      vars:
        CM_CLONE_UNSHALLOW: 'true'
      flutter: stable
      xcode: '27.1'
    scripts:
      - *check_app_settings
      - &prepare_shorebird
        name: Prepare Shorebird Configuration
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            ruby tool/prepare_shorebird.rb
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/prepare-shorebird-configuration.log"
      - &install_shorebird
        name: Install Shorebird
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            set -eu
            : "${SHOREBIRD_TOKEN:?Add SHOREBIRD_TOKEN to the shorebird group for this application}"
            shorebird_root="$HOME/.shorebird"
            if [ ! -d "$shorebird_root" ]; then
              git clone -b stable https://github.com/shorebirdtech/shorebird.git "$shorebird_root"
            fi
            "$shorebird_root/bin/shorebird" --version
            echo "PATH=$shorebird_root/bin:$PATH" >> "$CM_ENV"
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/install-shorebird.log"
      - *get_packages
      - *apply_signing
      - name: Build IPA
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            set -eu
            shallow_repository="$(git rev-parse --is-shallow-repository)"
            [ "$shallow_repository" = false ] || { echo "Codemagic checkout must contain the full Git history" >&2; exit 1; }
            build_number="$(git rev-list --count HEAD)"
            shorebird release ios --flutter-version=latest \
              --build-number="$build_number" \
              --export-options-plist=/Users/builder/export_options.plist \
              -- \
              --dart-define="SUPPORT_EMAIL=$SUPPORT_EMAIL" \
              --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL" \
              --dart-define="SUPPORT_URL=$SUPPORT_URL"
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/build-ipa.log"
      - name: Verify IPA
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          (
            set -eu
            : "${CM_BUILD_DIR:?Codemagic must provide the repository clone directory}"
            set -- "$CM_BUILD_DIR/build/ios/ipa/"*.ipa
            for artifact in "$@"; do
              [ -f "$artifact" ] && [ -s "$artifact" ] || { echo "Missing or empty IPA artifact: $artifact" >&2; exit 1; }
            done
          ) 2>&1 | tee "$CM_BUILD_DIR/build/logs/verify-ipa.log"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive/dSYMs/**/*.dSYM
      - $CM_BUILD_DIR/build/logs/*.log
      - /tmp/xcodebuild_logs/*.log
    publishing:
      scripts:
        - name: Verify Collected IPA
          script: |
            set -eu
            ruby -rjson -e 'artifacts = JSON.parse(ENV.fetch("CM_ARTIFACT_LINKS", "[]")); abort "Codemagic collected no .ipa artifact; publishing cannot succeed" unless artifacts.any? { |artifact| File.extname(artifact.fetch("name", "")) == ".ipa" }'
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - $TESTFLIGHT_BETA_GROUP
      slack: *failure_notifications

