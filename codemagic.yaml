workflows:
  templates-ios:
    name: UI Templates iOS
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: com.achimsapps.templates
        CM_CLONE_UNSHALLOW: 'true'
      flutter: 3.44.9
      xcode: 26.6
    scripts:
      - name: Get Packages
        script: flutter pub get
      - name: Initialize Signing Keychain
        script: keychain initialize
      - name: Fetch Signing Files
        script: |
          set -eu
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?APP_STORE_CONNECT_PRIVATE_KEY must be configured in appstore_credentials}"
          : "${CERTIFICATE_PRIVATE_KEY:?CERTIFICATE_PRIVATE_KEY must be configured in appstore_credentials}"
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add Signing Certificates
        script: keychain add-certificates
      - name: Apply Signing Profiles
        script: xcode-project use-profiles --project ios/Runner.xcodeproj
      - name: Build IPA
        script: |
          set -eu
          shallow_repository="$(git rev-parse --is-shallow-repository)"
          [ "$shallow_repository" = false ] || { echo "Codemagic checkout must contain the full Git history" >&2; exit 1; }
          build_number="$(git rev-list --count HEAD)"
          flutter build ipa --release --build-number="$build_number"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Tester
      email:
        recipients:
          - $CODEMAGIC_NOTIFICATION_EMAIL
        notify:
          success: false
          failure: true

  templates-android:
    name: UI Templates Android
    instance_type: mac_mini_m2
    max_build_duration: 45
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      groups:
        - google_play_credentials
      android_signing:
        - templates_keystore
      vars:
        CM_CLONE_UNSHALLOW: 'true'
      flutter: 3.44.9
    scripts:
      - name: Get Packages
        script: flutter pub get
      - name: Build App Bundle
        script: |
          set -eu
          shallow_repository="$(git rev-parse --is-shallow-repository)"
          [ "$shallow_repository" = false ] || { echo "Codemagic checkout must contain the full Git history" >&2; exit 1; }
          build_number="$(git rev-list --count HEAD)"
          flutter build appbundle --release --build-number="$build_number"
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
      email:
        recipients:
          - $CODEMAGIC_NOTIFICATION_EMAIL
        notify:
          success: false
          failure: true
