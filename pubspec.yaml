name: templates

publish_to: 'none'

version: 1.15.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  intl: ^0.20.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  yaml: ^3.1.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: icon/app_icon.png
  adaptive_icon_background: '#0B8BF9'
  adaptive_icon_foreground: icon/adaptive_foreground.png
  adaptive_icon_foreground_inset: 20
  remove_alpha_ios: true
  background_color_ios: '#F8F2E8'
  web:
    generate: true
    image_path: icon/app_icon.png
    background_color: '#F8F2E8'
    theme_color: '#232844'
  windows:
    generate: true
    image_path: icon/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: icon/app_icon.png

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/design_course/
    - assets/fitness_app/
    - assets/hotel/
    - assets/fonts/WorkSans-LICENSE.txt
    - assets/fonts/Roboto-LICENSE.txt
    - assets/licenses/smooth_star_rating-LICENSE.txt

  fonts:
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
