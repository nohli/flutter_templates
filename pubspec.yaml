name: templates

publish_to: 'none'

version: 1.16.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.8'

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  intl: ^0.20.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: icon/app_icon.png
  adaptive_icon_background: '#0B8BF9'
  adaptive_icon_foreground: icon/adaptive_foreground.png
  adaptive_icon_foreground_inset: 20
  remove_alpha_ios: true
  background_color_ios: '#F8F2E8'
  web:
    generate: true
    image_path: icon/app_icon.png
    background_color: '#F8F2E8'
    theme_color: '#232844'
  windows:
    generate: true
    image_path: icon/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: icon/app_icon.png

flutter:
  generate: true
  uses-material-design: true

  shaders:
    - shaders/rounded_border.frag

  assets:
    - assets/gallery/ar/
    - assets/gallery/bg/
    - assets/gallery/ca/
    - assets/gallery/cs/
    - assets/gallery/da/
    - assets/gallery/de/
    - assets/gallery/el/
    - assets/gallery/en/
    - assets/gallery/en_AU/
    - assets/gallery/en_GB/
    - assets/gallery/en_US/
    - assets/gallery/es/
    - assets/gallery/es_419/
    - assets/gallery/es_ES/
    - assets/gallery/fi/
    - assets/gallery/fr/
    - assets/gallery/fr_CA/
    - assets/gallery/fr_FR/
    - assets/gallery/he/
    - assets/gallery/hi/
    - assets/gallery/hr/
    - assets/gallery/hu/
    - assets/gallery/id/
    - assets/gallery/it/
    - assets/gallery/ja/
    - assets/gallery/kk/
    - assets/gallery/ko/
    - assets/gallery/ms/
    - assets/gallery/nb/
    - assets/gallery/nl/
    - assets/gallery/no/
    - assets/gallery/pl/
    - assets/gallery/pt/
    - assets/gallery/pt_BR/
    - assets/gallery/pt_PT/
    - assets/gallery/ro/
    - assets/gallery/ru/
    - assets/gallery/sk/
    - assets/gallery/sv/
    - assets/gallery/th/
    - assets/gallery/tr/
    - assets/gallery/uk/
    - assets/gallery/vi/
    - assets/gallery/zh/
    - assets/gallery/zh_Hans/
    - assets/gallery/zh_Hans_CN/
    - assets/gallery/zh_Hant/
    - assets/gallery/zh_Hant_HK/
    - assets/gallery/zh_Hant_TW/
    - assets/images/
    - assets/design_course/
    - assets/fitness_app/
    - assets/hotel/
    - assets/fonts/WorkSans-LICENSE.txt
    - assets/fonts/Roboto-LICENSE.txt
    - assets/fonts/BricolageGrotesque-LICENSE.txt
    - assets/fonts/Fraunces-LICENSE.txt
    - assets/fonts/SpaceGrotesk-LICENSE.txt
    - assets/licenses/smooth_star_rating-LICENSE.txt

  fonts:
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
